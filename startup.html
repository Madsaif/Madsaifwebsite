<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>MentorHub · Ultimate Student Suite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --bg-page: #f5f9ff; --card-bg: #ffffff; --text-main: #1a2c3e; --text-muted: #5a6e7c;
      --border: #e2edf2; --accent: #2b8c5e; --accent-light: #e5f5ed; --danger: #e25c5c;
      --shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
      --shadow-lg: 0 16px 36px rgba(0,0,0,0.08);
      --transition: 0.2s ease;
    }
    body { background: var(--bg-page); color: var(--text-main); font-family:'Inter',sans-serif; height:100vh; overflow:hidden; }
    .app { display:flex; flex-direction:column; height:100%; }
    .top-bar { background:var(--card-bg); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); flex-shrink:0; z-index:20; }
    .logo-area { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.3rem; font-family:'Outfit',sans-serif; color:var(--accent); }
    .user-greeting { background:var(--accent-light); padding:6px 16px; border-radius:40px; font-weight:500; font-size:0.85rem; }
    .settings-btn { background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--text-main); }
    .main-scroll { flex:1; overflow-y:auto; padding:0; -webkit-overflow-scrolling:touch; }
    .subtab-bar { display:flex; background:var(--card-bg); border-bottom:1px solid var(--border); justify-content:space-evenly; position:sticky; top:0; z-index:15; }
    .subtab-item { padding:12px 0; font-weight:600; font-size:0.82rem; color:var(--text-muted); cursor:pointer; border-bottom:3px solid transparent; flex:1; text-align:center; display:flex; align-items:center; justify-content:center; gap:6px; }
    .subtab-item.active { color:var(--accent); border-bottom-color:var(--accent); }
    .bottom-nav { background:var(--card-bg); display:flex; justify-content:space-around; padding:8px 12px 16px; border-top:1px solid var(--border); flex-shrink:0; }
    .nav-btn { background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:0.7rem; font-weight:600; color:var(--text-muted); cursor:pointer; padding:6px 12px; border-radius:40px; transition:var(--transition); }
    .nav-btn i { font-size:1.5rem; }
    .nav-btn.active { background:var(--accent-light); color:var(--accent); }
    .task-card, .book-card, .exam-card, .expense-card, .stat-card { background:var(--card-bg); border-radius:24px; padding:16px; margin:10px 14px; box-shadow:var(--shadow); border-left:6px solid var(--accent); transition:var(--transition); }
    .chapter-item { background:var(--bg-page); border:1px solid var(--border); border-radius:60px; padding:10px 18px; margin-top:8px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:8px; }
    .big-checkbox { width:26px; height:26px; border-radius:30px; border:2px solid var(--accent); display:inline-flex; align-items:center; justify-content:center; background:var(--card-bg); cursor:pointer; flex-shrink:0; }
    .big-checkbox.checked { background:var(--accent); color:white; }
    button, .btn { background:var(--accent); border:none; padding:10px 18px; border-radius:40px; color:white; font-weight:600; cursor:pointer; font-family:inherit; font-size:0.85rem; transition:var(--transition); }
    .btn-outline { background:transparent; border:1px solid var(--accent); color:var(--accent); }
    .timer-digits { font-family:monospace; font-size:3rem; font-weight:800; letter-spacing:2px; }
    .calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; padding:12px; background:var(--card-bg); border-radius:28px; margin:10px 14px; }
    .cal-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:60px; font-weight:500; font-size:0.85rem; cursor:pointer; background:var(--bg-page); }
    .cal-day.today { border:2px solid var(--accent); background:var(--accent-light); font-weight:700; }
    .cal-day.selected { background:var(--accent); color:white; }
    .meal-pill { background:var(--bg-page); border:1px solid var(--border); padding:10px 18px; border-radius:40px; cursor:pointer; font-weight:600; display:flex; align-items:center; gap:6px; }
    .meal-pill.active { background:var(--accent); color:white; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:1000; }
    .modal-card { background:var(--card-bg); border-radius:32px; width:90%; max-width:480px; padding:28px; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-lg); }
    .modal-card h3 { margin-bottom:18px; font-weight:700; }
    .modal-card input, .modal-card select { width:100%; margin-bottom:16px; padding:12px 16px; border-radius:40px; border:1px solid var(--border); background:var(--bg-page); font-family:inherit; }
    .modal-buttons { display:flex; justify-content:center; gap:12px; margin-top:20px; flex-wrap:wrap; }
    .modal-buttons button { min-width:100px; }
    .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--accent); color:white; padding:12px 24px; border-radius:60px; z-index:1100; animation:fadeUp 0.2s ease; }
    @keyframes fadeUp { from{opacity:0; transform:translateX(-50%) translateY(20px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }
    .chart-container { background:var(--card-bg); border-radius:24px; padding:16px; margin:16px 14px; box-shadow:var(--shadow); }
    canvas { max-height:260px; width:100%; }
    .color-swatch { width:48px; height:48px; border-radius:30px; cursor:pointer; border:3px solid transparent; transition:0.2s; }
    .color-swatch.selected { border-color:var(--text-main); transform:scale(1.1); }
    .progress-bar-bg { background:#e9ecef; border-radius:30px; height:10px; overflow:hidden; margin-top:6px; }
    .progress-fill { background:var(--accent); height:100%; width:0%; border-radius:30px; }
    .stats-grid { display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; }
    .month-nav { display: flex; justify-content: space-between; align-items: center; margin: 12px 14px; background: var(--card-bg); padding: 10px 16px; border-radius: 60px; }
    .month-nav button { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; }
    .custom-timer-input { display: flex; gap: 8px; justify-content: center; margin: 12px 0; align-items: center; flex-wrap: wrap; }
    .custom-timer-input input { width: 80px; padding: 8px; border-radius: 30px; border: 1px solid var(--border); text-align: center; }
  </style>
</head>
<body>
<div class="app" id="appRoot">
  <div class="top-bar"><div class="logo-area"><i class="fas fa-seedling"></i><span>MentorHub</span></div><div class="user-greeting" id="userGreeting">Hello, Student</div><button class="settings-btn" id="settingsBtn"><i class="fas fa-cog"></i></button></div>
  <div class="main-scroll" id="mainContent"></div>
  <div class="bottom-nav"><button class="nav-btn" data-nav="home"><i class="fas fa-home"></i><span>Home</span></button><button class="nav-btn" data-nav="study"><i class="fas fa-book-open"></i><span>Study</span></button><button class="nav-btn" data-nav="expense"><i class="fas fa-coins"></i><span>Expense</span></button><button class="nav-btn" data-nav="stats"><i class="fas fa-chart-line"></i><span>Stats</span></button></div>
</div>
<script>
  // ---------- DATA ----------
  let app = { books: [], tasks: [], meals: [], expenses: [], mealRates: { morning: 35, noon: 50, night: 45 }, exams: [], timerSessions: [] };
  let currentTab = "home", homeSub = "tasks", studySub = "planner", expenseSub = "meals", statsSub = "timelog";
  let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
  let selectedDate = new Date().toISOString().slice(0,10);
  let currentBookId = null, currentChapterId = null, currentExamId = null;
  let timerActive = false, timerSeconds = 1500, timerMilli = 0, timerInterval = null, selectedTimerTaskId = null, selectedTimerItemId = null, timerStartTimestamp = null;
  let stopwatchActive = false, stopwatchSeconds = 0, stopwatchMilli = 0, stopwatchLaps = [], stopwatchInterval = null;
  let charts = {};

  // helper: custom modal confirm
  function showConfirmDialog(message, onConfirm, onCancel) {
    const modalDiv = document.createElement("div");
    modalDiv.className = "modal-overlay";
    modalDiv.innerHTML = `<div class="modal-card"><h3><i class="fas fa-question-circle"></i> Confirm</h3><p style="margin-bottom:24px;">${escapeHtml(message)}</p><div class="modal-buttons"><button class="btn-outline" id="confirmNo">Cancel</button><button id="confirmYes">Confirm</button></div></div>`;
    document.body.appendChild(modalDiv);
    const closeModal = () => modalDiv.remove();
    modalDiv.querySelector("#confirmYes").addEventListener("click", () => { closeModal(); if(onConfirm) onConfirm(); });
    modalDiv.querySelector("#confirmNo").addEventListener("click", () => { closeModal(); if(onCancel) onCancel(); });
    modalDiv.addEventListener("click", e => { if(e.target === modalDiv) closeModal(); });
  }

  function showInputDialog(title, placeholder, defaultValue, callback) {
    const modalDiv = document.createElement("div");
    modalDiv.className = "modal-overlay";
    modalDiv.innerHTML = `<div class="modal-card"><h3>${escapeHtml(title)}</h3><input type="text" id="dialogInput" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(defaultValue)}" autocomplete="off"><div class="modal-buttons"><button class="btn-outline" id="inputCancel">Cancel</button><button id="inputSave">Save</button></div></div>`;
    document.body.appendChild(modalDiv);
    const inputEl = modalDiv.querySelector("#dialogInput");
    inputEl.focus();
    const closeModal = () => modalDiv.remove();
    modalDiv.querySelector("#inputSave").addEventListener("click", () => { const val = inputEl.value.trim(); closeModal(); if(val && callback) callback(val); });
    modalDiv.querySelector("#inputCancel").addEventListener("click", () => { closeModal(); if(callback) callback(null); });
    modalDiv.addEventListener("click", e => { if(e.target === modalDiv) closeModal(); });
  }

  function saveData() { localStorage.setItem("mentor_final", JSON.stringify(app)); }
  function loadData() {
    let raw = localStorage.getItem("mentor_final");
    if (raw) { try { app = JSON.parse(raw); } catch(e) {} }
    if (!app.books) app.books = [];
    if (!app.tasks) app.tasks = [];
    if (!app.meals) app.meals = [];
    if (!app.expenses) app.expenses = [];
    if (!app.exams) app.exams = [];
    if (!app.timerSessions) app.timerSessions = [];
    app.books.forEach(b => { if (!b.chapters) b.chapters = []; b.chapters.forEach(ch => { if (!ch.chapterTasks) ch.chapterTasks = []; }); });
    app.tasks.forEach(t => { if (!t.items) t.items = []; t.items.forEach(i => { if (i.timeSpent === undefined) i.timeSpent = 0; if (!i.id) i.id = Date.now() + Math.random(); }); });
    if(!app.mealRates) app.mealRates = { morning:35, noon:50, night:45 };
  }
  function showToast(msg) { let t = document.createElement("div"); t.className = "toast"; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
  function render() { if (currentTab === "home") renderHome(); else if (currentTab === "study") renderStudy(); else if (currentTab === "expense") renderExpense(); else if (currentTab === "stats") renderStats(); }

  function syncChapterTaskCompletion(bookId, chapterId, chapterTaskId, completed) { /* sync both sides */
    for (let task of app.tasks) {
      for (let item of task.items) {
        if (item.bookId === bookId && item.chapterId === chapterId && item.chapterTaskId === chapterTaskId) {
          item.completed = completed;
        }
      }
    }
    saveData();
  }
  function syncTaskItemCompletion(bookId, chapterId, chapterTaskId, completed) {
    let book = app.books.find(b => b.id === bookId);
    if (book) {
      let chapter = book.chapters.find(c => c.id === chapterId);
      if (chapter) {
        let ct = chapter.chapterTasks.find(t => t.id === chapterTaskId);
        if (ct) ct.completed = completed;
      }
    }
    saveData();
  }

  // ---------- HOME ----------
  function renderHome() {
    if (homeSub === "tasks") renderHomeTasks();
    else if (homeSub === "timer") renderHomeTimer();
    else if (homeSub === "stopwatch") renderHomeStopwatch();
  }
  function renderHomeTasks() {
    let subtabs = `<div class="subtab-bar"><div class="subtab-item ${homeSub === 'tasks' ? 'active' : ''}" data-sub="tasks"><i class="fas fa-list-ul"></i> Tasks</div><div class="subtab-item ${homeSub === 'timer' ? 'active' : ''}" data-sub="timer"><i class="fas fa-hourglass-half"></i> Timer</div><div class="subtab-item ${homeSub === 'stopwatch' ? 'active' : ''}" data-sub="stopwatch"><i class="fas fa-stopwatch"></i> Stopwatch</div></div>`;
    let today = new Date().toISOString().slice(0,10);
    let activeTasks = app.tasks.filter(t => t.startDate <= today && t.endDate >= today);
    let tasksHtml = activeTasks.map(task => `<div class="task-card"><div class="task-title" style="font-weight:800;">${escapeHtml(task.title)}</div><div class="task-meta"><i class="fas fa-calendar-alt"></i> ${task.startDate} → ${task.endDate}</div>${task.items.map(item => { let book = app.books.find(b => b.id == item.bookId); let chap = book?.chapters.find(c => c.id == item.chapterId); let ct = chap?.chapterTasks?.find(c => c.id == item.chapterTaskId); return `<div style="display:flex; align-items:center; gap:8px; margin:8px 0;"><div class="big-checkbox ${item.completed ? 'checked' : ''}" data-taskid="${task.id}" data-itemid="${item.id}" data-bookid="${item.bookId}" data-chapterid="${item.chapterId}" data-ctid="${item.chapterTaskId}">${item.completed ? '<i class="fas fa-check"></i>' : ''}</div><span><i class="fas fa-circle"></i> ${book?.name || '?'} · ${chap?.serial || '#'}. ${ct?.name || 'Type'}</span></div>`; }).join('')}<div class="task-actions" style="margin-top:12px;"><button class="edit-task-btn btn-outline btn-sm" data-id="${task.id}"><i class="fas fa-edit"></i> Edit</button><button class="delete-task-btn btn-sm" data-id="${task.id}" style="background:var(--danger);color:white;border:none;padding:6px 12px;border-radius:30px;"><i class="fas fa-trash"></i> Delete</button></div></div>`).join('');
    if (!activeTasks.length) tasksHtml = `<div class="task-card" style="text-align:center;">No tasks for today. Add one in Study → Planner.</div>`;
    document.getElementById("mainContent").innerHTML = subtabs + `<div>${tasksHtml}</div>`;
    attachSubHomeEvents();
    document.querySelectorAll(".big-checkbox").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); let taskId = parseInt(el.dataset.taskid), itemId = parseInt(el.dataset.itemid); let task = app.tasks.find(t => t.id == taskId); if(task){ let item = task.items.find(i => i.id == itemId); if(item){ let newState = !item.completed; item.completed = newState; syncTaskItemCompletion(item.bookId, item.chapterId, item.chapterTaskId, newState); saveData(); renderHomeTasks(); showToast(newState ? "Completed! 🎉" : "Reopened"); } } }));
    document.querySelectorAll(".edit-task-btn").forEach(btn => btn.addEventListener("click", e => { e.stopPropagation(); editTaskModal(parseInt(btn.dataset.id)); }));
    document.querySelectorAll(".delete-task-btn").forEach(btn => btn.addEventListener("click", e => { showConfirmDialog("Delete this task permanently?", () => { app.tasks = app.tasks.filter(t => t.id != parseInt(btn.dataset.id)); saveData(); renderHomeTasks(); showToast("Task deleted"); }); }));
  }
  function editTaskModal(taskId) { let task = app.tasks.find(t => t.id == taskId); if(!task) return; showInputDialog("Edit Task Title", "New title", task.title, (newTitle) => { if(newTitle) { task.title = newTitle; saveData(); renderHomeTasks(); showToast("Updated"); } }); }
  function attachSubHomeEvents() { document.querySelectorAll("[data-sub]").forEach(el => el.addEventListener("click", () => { homeSub = el.dataset.sub; renderHome(); })); }

  // Timer with CUSTOM TIME input
  function renderHomeTimer() { 
    let subtabs = `<div class="subtab-bar"><div class="subtab-item" data-sub="tasks"><i class="fas fa-list-ul"></i> Tasks</div><div class="subtab-item active" data-sub="timer"><i class="fas fa-hourglass-half"></i> Timer</div><div class="subtab-item" data-sub="stopwatch"><i class="fas fa-stopwatch"></i> Stopwatch</div></div>`;
    let today = new Date().toISOString().slice(0,10);
    let activeTasks = app.tasks.filter(t => t.startDate <= today && t.endDate >= today);
    let taskOpts = `<option value="">-- Select task --</option>` + activeTasks.map(t => `<option value="${t.id}" ${selectedTimerTaskId == t.id ? 'selected' : ''}>${escapeHtml(t.title)}</option>`).join('');
    let itemOpts = `<option value="">-- Select type --</option>`;
    if (selectedTimerTaskId) { let task = app.tasks.find(t => t.id == selectedTimerTaskId); if(task) { itemOpts += task.items.map(it => { let book = app.books.find(b => b.id == it.bookId); let chap = book?.chapters.find(c => c.id == it.chapterId); let ct = chap?.chapterTasks?.find(c => c.id == it.chapterTaskId); return `<option value="${it.id}" ${selectedTimerItemId == it.id ? 'selected' : ''}>${book?.name || '?'} · ${chap?.serial || '#'}. ${ct?.name || 'Type'}</option>`; }).join(''); } }
    let mins = Math.floor(timerSeconds/60), secs = timerSeconds%60;
    let display = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${Math.floor(timerMilli/10).toString().padStart(2,'0')}`;
    let html = subtabs + `<div class="full-timer" style="padding:20px;text-align:center;">
      <select id="timerTaskSelect">${taskOpts}</select>
      <select id="timerItemSelect">${itemOpts}</select>
      <div class="time-preset-row" style="display:flex;gap:8px;justify-content:center;margin:12px 0;">
        <button class="preset-btn" data-min="5">5 min</button><button class="preset-btn" data-min="15">15 min</button><button class="preset-btn active" data-min="25">25 min</button><button class="preset-btn" data-min="30">30 min</button>
      </div>
      <div class="custom-timer-input">
        <input type="number" id="customMinutes" placeholder="Min" min="0" step="1" value="0"> <span>min</span>
        <input type="number" id="customSeconds" placeholder="Sec" min="0" max="59" step="1" value="0"> <span>sec</span>
        <button id="setCustomTimer">Set Custom</button>
      </div>
      <div class="timer-digits" id="timerDisplay">${display}</div>
      <div style="margin:16px;"><button id="timerStart">Start</button> <button id="timerPause">Pause</button> <button id="timerReset">Reset</button> <button id="timerFinish">Finish</button></div>
    </div>`;
    document.getElementById("mainContent").innerHTML = html;
    attachSubHomeEvents();
    document.getElementById("timerTaskSelect").addEventListener("change", e => { selectedTimerTaskId = e.target.value ? parseInt(e.target.value) : null; selectedTimerItemId = null; renderHomeTimer(); });
    document.getElementById("timerItemSelect").addEventListener("change", e => { selectedTimerItemId = e.target.value ? parseInt(e.target.value) : null; });
    document.querySelectorAll(".preset-btn").forEach(btn => btn.addEventListener("click", () => { document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active")); btn.classList.add("active"); timerSeconds = parseInt(btn.dataset.min) * 60; timerMilli = 0; updateTimerDisplay(); }));
    document.getElementById("setCustomTimer").addEventListener("click", () => { let mins = parseInt(document.getElementById("customMinutes").value) || 0; let secs = parseInt(document.getElementById("customSeconds").value) || 0; let total = mins*60 + secs; if(total > 0) { timerSeconds = total; timerMilli = 0; updateTimerDisplay(); showToast("Custom time set"); } else showToast("Enter valid time"); });
    document.getElementById("timerStart").addEventListener("click", () => { if(!selectedTimerTaskId || !selectedTimerItemId) { showToast("Select task and type"); return; } if(timerActive) return; timerActive = true; timerStartTimestamp = Date.now(); if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if(timerActive) { timerMilli += 10; if(timerMilli >= 1000) { timerMilli = 0; if(timerSeconds > 0) timerSeconds--; else { clearInterval(timerInterval); timerActive = false; addTimeToSelectedItem(); showToast("Time's up! Session recorded."); renderHomeTimer(); return; } } updateTimerDisplay(); } }, 10); });
    document.getElementById("timerPause").addEventListener("click", () => { addTimeToSelectedItem(); timerActive = false; clearInterval(timerInterval); timerInterval = null; renderHomeTimer(); });
    document.getElementById("timerReset").addEventListener("click", () => { addTimeToSelectedItem(); timerActive = false; clearInterval(timerInterval); timerInterval = null; let p = document.querySelector(".preset-btn.active"); timerSeconds = (p ? parseInt(p.dataset.min) : 25) * 60; timerMilli = 0; timerStartTimestamp = null; renderHomeTimer(); });
    document.getElementById("timerFinish").addEventListener("click", () => { addTimeToSelectedItem(); timerActive = false; clearInterval(timerInterval); timerInterval = null; showToast("Finished and recorded"); renderHomeTimer(); });
  }
  function addTimeToSelectedItem() { if(!selectedTimerItemId || !timerStartTimestamp) return; let elapsed = Math.floor((Date.now() - timerStartTimestamp) / 1000); if(elapsed <= 0) return; for(let task of app.tasks) { let item = task.items.find(i => i.id == selectedTimerItemId); if(item) { item.timeSpent = (item.timeSpent || 0) + elapsed; app.timerSessions.push({ date: new Date().toISOString().slice(0,10), taskId: task.id, itemId: item.id, seconds: elapsed }); saveData(); break; } } timerStartTimestamp = null; }
  function updateTimerDisplay() { let el = document.getElementById("timerDisplay"); if(!el) return; let m = Math.floor(timerSeconds/60), s = timerSeconds%60; el.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${Math.floor(timerMilli/10).toString().padStart(2,'0')}`; }
  function renderHomeStopwatch() { /* unchanged */ 
    let subtabs = `<div class="subtab-bar"><div class="subtab-item" data-sub="tasks"><i class="fas fa-list-ul"></i> Tasks</div><div class="subtab-item" data-sub="timer"><i class="fas fa-hourglass-half"></i> Timer</div><div class="subtab-item active" data-sub="stopwatch"><i class="fas fa-stopwatch"></i> Stopwatch</div></div>`;
    let hrs = Math.floor(stopwatchSeconds/3600), mins = Math.floor((stopwatchSeconds%3600)/60), secs = stopwatchSeconds%60;
    let display = `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${Math.floor(stopwatchMilli/10).toString().padStart(2,'0')}`;
    let lapsHtml = stopwatchLaps.map((lap,i) => { let lh = Math.floor(lap/3600), lm = Math.floor((lap%3600)/60), ls = lap%60; return `<div>Lap ${i+1}: ${String(lh).padStart(2,'0')}:${String(lm).padStart(2,'0')}:${String(ls).padStart(2,'0')}</div>`; }).join('');
    let html = subtabs + `<div style="padding:20px;text-align:center;"><div class="timer-digits">${display}</div><div style="margin:16px;"><button id="swStart">Start</button> <button id="swPause">Pause</button> <button id="swReset">Reset</button> <button id="swLap">Lap</button></div><div style="max-height:150px;overflow:auto;">${lapsHtml || "No laps"}</div></div>`;
    document.getElementById("mainContent").innerHTML = html;
    attachSubHomeEvents();
    document.getElementById("swStart").addEventListener("click", () => { if(stopwatchActive) return; stopwatchActive = true; if(stopwatchInterval) clearInterval(stopwatchInterval); stopwatchInterval = setInterval(() => { if(stopwatchActive) { stopwatchMilli += 10; if(stopwatchMilli >= 1000) { stopwatchMilli = 0; stopwatchSeconds++; } updateSwDisplay(); } }, 10); });
    document.getElementById("swPause").addEventListener("click", () => { stopwatchActive = false; clearInterval(stopwatchInterval); stopwatchInterval = null; renderHomeStopwatch(); });
    document.getElementById("swReset").addEventListener("click", () => { stopwatchActive = false; clearInterval(stopwatchInterval); stopwatchInterval = null; stopwatchSeconds = 0; stopwatchMilli = 0; stopwatchLaps = []; renderHomeStopwatch(); });
    document.getElementById("swLap").addEventListener("click", () => { if(stopwatchActive) stopwatchLaps.push(stopwatchSeconds); renderHomeStopwatch(); });
    function updateSwDisplay() { let el = document.querySelector(".timer-digits"); if(el){ let h = Math.floor(stopwatchSeconds/3600), m = Math.floor((stopwatchSeconds%3600)/60), s = stopwatchSeconds%60; el.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${Math.floor(stopwatchMilli/10).toString().padStart(2,'0')}`; } }

  // ----- STUDY (Planner, Books, Marks) with custom confirm for deletions -----
  function renderStudy() { if (studySub === "planner") renderStudyPlanner(); else if (studySub === "books") renderBooksPage(); else if (studySub === "marks") renderMarksPage(); }
  function renderStudyPlanner() { /* unchanged planner */ 
    let subtabs = `<div class="subtab-bar"><div class="subtab-item ${studySub === 'planner' ? 'active' : ''}" data-studysub="planner"><i class="fas fa-calendar-alt"></i> Planner</div><div class="subtab-item ${studySub === 'books' ? 'active' : ''}" data-studysub="books"><i class="fas fa-book"></i> Books</div><div class="subtab-item ${studySub === 'marks' ? 'active' : ''}" data-studysub="marks"><i class="fas fa-chart-simple"></i> Marks</div></div>`;
    let monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    let firstDay = new Date(calYear, calMonth, 1).getDay();
    let daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    let grid = '<div class="calendar-grid">' + "SMTWTFS".split('').map(d => `<div style="text-align:center;font-weight:700;">${d}</div>`).join('');
    for(let i=0;i<firstDay;i++) grid += '<div class="cal-day"></div>';
    for(let d=1; d<=daysInMonth; d++) { let dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; let isToday = dateStr === new Date().toISOString().slice(0,10); let isSelected = dateStr === selectedDate; grid += `<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''}" data-date="${dateStr}">${d}</div>`; }
    grid += '</div>';
    let html = subtabs + `<div style="margin:14px;"><div style="display:flex;justify-content:space-between;"><button id="prevMonthCal" class="btn-outline btn-sm"><i class="fas fa-chevron-left"></i></button><span style="font-weight:700;">${monthNames[calMonth]} ${calYear}</span><button id="nextMonthCal" class="btn-outline btn-sm"><i class="fas fa-chevron-right"></i></button><button id="goTodayCal" class="btn-outline btn-sm"><i class="fas fa-sun"></i></button><button id="addTaskPlannerBtn" class="btn"><i class="fas fa-plus"></i> Add Task</button></div>${grid}</div>`;
    document.getElementById("mainContent").innerHTML = html;
    document.querySelectorAll("[data-studysub]").forEach(el => el.addEventListener("click", () => { studySub = el.dataset.studysub; currentBookId=null; currentChapterId=null; renderStudy(); }));
    document.getElementById("prevMonthCal").addEventListener("click", () => { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderStudyPlanner(); });
    document.getElementById("nextMonthCal").addEventListener("click", () => { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderStudyPlanner(); });
    document.getElementById("goTodayCal").addEventListener("click", () => { let t = new Date(); calYear = t.getFullYear(); calMonth = t.getMonth(); selectedDate = t.toISOString().slice(0,10); renderStudyPlanner(); });
    document.querySelectorAll(".cal-day[data-date]").forEach(el => el.addEventListener("click", () => { selectedDate = el.dataset.date; renderStudyPlanner(); }));
    document.getElementById("addTaskPlannerBtn").addEventListener("click", () => openTaskModal(selectedDate));
  }
  function openTaskModal(defaultDate) { /* existing modal (already custom) */ if (!app.books.length) { showToast("Please add a book first."); return; } let modal = document.createElement("div"); modal.className = "modal-overlay"; modal.innerHTML = `<div class="modal-card"><h3>New Task</h3><input id="taskTitle" placeholder="Task title"><label>Start Date</label><input id="startDate" type="date" value="${defaultDate}"><label>End Date</label><input id="endDate" type="date" value="${defaultDate}"><div><strong>Assignments</strong><div id="assignedList"></div></div><div style="display:flex;gap:8px;"><select id="bookSelect">${app.books.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select><select id="chapterSelect"></select><button id="addAssignBtn" class="btn-sm">Add Type</button></div><div id="typeCheckboxes"></div><div class="modal-buttons"><button id="saveTaskBtn">Save Task</button><button id="cancelTaskBtn" class="btn-outline">Cancel</button></div></div>`; document.body.appendChild(modal); let assignments = []; let bookSel = modal.querySelector("#bookSelect"), chapSel = modal.querySelector("#chapterSelect"), typeDiv = modal.querySelector("#typeCheckboxes"), assignedDiv = modal.querySelector("#assignedList"); function updateChapters() { let bid = parseInt(bookSel.value); let book = app.books.find(b=>b.id==bid); chapSel.innerHTML = book?.chapters.map(ch=>`<option value="${ch.id}">${ch.serial}. ${ch.name}</option>`).join('') || ''; updateTypes(); } function updateTypes() { let bid = parseInt(bookSel.value), cid = parseInt(chapSel.value); let book = app.books.find(b=>b.id==bid); let chap = book?.chapters.find(c=>c.id==cid); typeDiv.innerHTML = chap?.chapterTasks.map(ct=>`<label style="display:flex;align-items:center;gap:8px;margin:4px 0;"><input type="checkbox" value="${ct.id}" class="typeCheck"> ${ct.name}</label>`).join('') || ''; } bookSel.addEventListener("change", updateChapters); chapSel.addEventListener("change", updateTypes); updateChapters(); modal.querySelector("#addAssignBtn").addEventListener("click", () => { let checks = typeDiv.querySelectorAll(".typeCheck:checked"); checks.forEach(cb => { let ctId = parseInt(cb.value); if(!assignments.some(a=>a.chapterTaskId===ctId)) { let bookId = parseInt(bookSel.value); let chapterId = parseInt(chapSel.value); assignments.push({ bookId, chapterId, chapterTaskId: ctId }); } renderAssignments(); }); }); function renderAssignments() { assignedDiv.innerHTML = assignments.map((a,idx)=> { let book=app.books.find(b=>b.id==a.bookId); let chap=book?.chapters.find(c=>c.id==a.chapterId); let ct=chap?.chapterTasks?.find(c=>c.id==a.chapterTaskId); return `<div style="display:flex;justify-content:space-between;margin:4px 0;"><span>${book?.name} · ${chap?.serial}. ${ct?.name}</span><button class="removeAssign" data-idx="${idx}" style="background:var(--danger);color:white;border:none;border-radius:30px;padding:2px 8px;">X</button></div>`; }).join(''); document.querySelectorAll(".removeAssign").forEach(btn=>btn.addEventListener("click",()=>{ assignments.splice(parseInt(btn.dataset.idx),1); renderAssignments(); })); } modal.querySelector("#saveTaskBtn").addEventListener("click", () => { let title = modal.querySelector("#taskTitle").value.trim(); if(!title || !assignments.length) { showToast("Title and at least one assignment required"); return; } let newItems = assignments.map(a=>({ id: Date.now()+Math.random(), bookId: a.bookId, chapterId: a.chapterId, chapterTaskId: a.chapterTaskId, completed: false, timeSpent: 0 })); app.tasks.push({ id: Date.now(), title, startDate: modal.querySelector("#startDate").value, endDate: modal.querySelector("#endDate").value, items: newItems }); saveData(); modal.remove(); renderStudyPlanner(); if(currentTab==='home') renderHome(); showToast("Task added"); }); modal.querySelector("#cancelTaskBtn").addEventListener("click",()=>modal.remove()); modal.addEventListener("click",e=>{if(e.target===modal) modal.remove();}); }
  function renderBooksPage() { if(currentChapterId) renderChapterDetail(); else if(currentBookId) renderSingleBook(); else renderBooksList(); }
  function renderBooksList() { let subtabs = `<div class="subtab-bar"><div class="subtab-item" data-studysub="planner"><i class="fas fa-calendar-alt"></i> Planner</div><div class="subtab-item active" data-studysub="books"><i class="fas fa-book"></i> Books</div><div class="subtab-item" data-studysub="marks"><i class="fas fa-chart-simple"></i> Marks</div></div>`; let html = subtabs + `<div style="padding:16px;"><button id="addBookGlobal"><i class="fas fa-plus"></i> Add Book</button><div id="booksContainer"></div></div>`; document.getElementById("mainContent").innerHTML = html; document.querySelectorAll("[data-studysub]").forEach(el=>el.addEventListener("click",()=>{ studySub=el.dataset.studysub; currentBookId=null; currentChapterId=null; renderStudy(); })); document.getElementById("addBookGlobal").addEventListener("click",()=>{ let modal=document.createElement("div"); modal.className="modal-overlay"; modal.innerHTML=`<div class="modal-card"><h3>Add Book</h3><input id="bookName" placeholder="Book name"><div class="modal-buttons"><button id="saveBook">Save</button><button id="cancelBook" class="btn-outline">Cancel</button></div></div>`; document.body.appendChild(modal); modal.querySelector("#saveBook").addEventListener("click",()=>{ let name=modal.querySelector("#bookName").value.trim(); if(name){ app.books.push({ id:Date.now(), name, chapters:[] }); saveData(); modal.remove(); renderBooksList(); showToast("Book added"); } }); modal.querySelector("#cancelBook").addEventListener("click",()=>modal.remove()); }); let container=document.getElementById("booksContainer"); if(container) container.innerHTML = app.books.map(b=>`<div class="book-card" data-bookid="${b.id}" style="cursor:pointer;margin:12px 0;padding:16px;"><strong>${escapeHtml(b.name)}</strong><div>${b.chapters.length} chapters</div><div><button class="editBookBtn btn-sm" data-id="${b.id}"><i class="fas fa-edit"></i></button><button class="deleteBookBtn btn-sm" data-id="${b.id}" style="background:var(--danger);">   function renderSingleBook() { let book=app.books.find(b=>b.id==currentBookId); if(!book){ currentBookId=null; renderBooksList(); return; } let html=`<div style="margin:12px;"><button id="backToBooks" class="btn-back"><i class="fas fa-arrow-left"></i> Back</button><h2>${escapeHtml(book.name)}</h2><button id="addChapterBtn"><i class="fas fa-plus"></i> Chapter</button><div id="chaptersContainer"></div></div>`; document.getElementById("mainContent").innerHTML=html; document.getElementById("backToBooks").addEventListener("click",()=>{ currentBookId=null; renderBooksPage(); }); document.getElementById("addChapterBtn").addEventListener("click",()=>{ let modal=document.createElement("div"); modal.className="modal-overlay"; modal.innerHTML=`<div class="modal-card"><h3>Add Chapter</h3><input id="chapterSerial" type="number" placeholder="Serial"><input id="chapterName" placeholder="Chapter name"><div class="modal-buttons"><button id="saveChap">Save</button><button id="cancelChap" class="btn-outline">Cancel</button></div></div>`; document.body.appendChild(modal); modal.querySelector("#saveChap").addEventListener("click",()=>{ let s=parseInt(modal.querySelector("#chapterSerial").value); let n=modal.querySelector("#chapterName").value.trim(); if(s && n){ book.chapters.push({ id:Date.now(), serial:s, name:n, chapterTasks:[] }); book.chapters.sort((a,b)=>a.serial-b.serial); saveData(); modal.remove(); renderSingleBook(); showToast("Chapter added"); } }); modal.querySelector("#cancelChap").addEventListener("click",()=>modal.remove()); }); let container=document.getElementById("chaptersContainer"); container.innerHTML=book.chapters.map(ch=>`<div class="chapter-item" data-chapterid="${ch.id}"><span><strong>${ch.serial}.</strong> ${escapeHtml(ch.name)}</span><div><button class="editChapterBtn btn-sm" data-id="${ch.id}">Edit</button><button class="delChapterBtn btn-sm" data-id="${ch.id}" style="background:var(--danger);">Del</button></div></div>`).join(''); document.querySelectorAll(".chapter-item").forEach(item=>item.addEventListener("click",e=>{ if(e.target.closest("button")) return; currentChapterId=parseInt(item.dataset.chapterid); renderBooksPage(); })); document.querySelectorAll(".editChapterBtn").forEach(btn=>btn.addEventListener("click",e=>{ e.stopPropagation(); let chId=parseInt(btn.dataset.id); let ch=book.chapters.find(c=>c.id==chId); let modal=document.createElement("div"); modal.className="modal-overlay"; modal.innerHTML=`<div class="modal-card"><h3>Edit Chapter</h3><input id="chapSerial" type="number" value="${ch.serial}"><input id="chapName" value="${escapeHtml(ch.name)}"><div class="modal-buttons"><button id="saveChapEdit">Save</button><button id="cancelChapEdit" class="btn-outline">Cancel</button></div></div>`; document.body.appendChild(modal); modal.querySelector("#saveChapEdit").addEventListener("click",()=>{ let ns=parseInt(modal.querySelector("#chapSerial").value); let nn=modal.querySelector("#chapName").value.trim(); if(ns && nn){ ch.serial=ns; ch.name=nn; book.chapters.sort((a,b)=>a.serial-b.serial); saveData(); modal.remove(); renderSingleBook(); showToast("Chapter updated"); } }); modal.querySelector("#cancelChapEdit").addEventListener("click",()=>modal.remove()); })); document.querySelectorAll(".delChapterBtn").forEach(btn=>btn.addEventListener("click",e=>{ e.stopPropagation(); showConfirmDialog("Delete this chapter?", ()=>{ book.chapters=book.chapters.filter(c=>c.id!=parseInt(btn.dataset.id)); saveData(); renderSingleBook(); }); })); }
  function renderChapterDetail() { let book=app.books.find(b=>b.id==currentBookId); let chapter=book?.chapters.find(c=>c.id==currentChapterId); if(!chapter){ currentChapterId=null; renderBooksPage(); return; } let html=`<div style="margin:12px;"><button id="backFromChapter" class="btn-back"><i class="fas fa-arrow-left"></i> Back</button><h2>${escapeHtml(book.name)} · ${chapter.serial}. ${escapeHtml(chapter.name)}</h2><div><button id="addTypeBtn">Add Type</button></div><div id="typesContainer"></div></div>`; document.getElementById("mainContent").innerHTML=html; document.getElementById("backFromChapter").addEventListener("click",()=>{ currentChapterId=null; renderBooksPage(); }); document.getElementById("addTypeBtn").addEventListener("click",()=>{ let modal=document.createElement("div"); modal.className="modal-overlay"; modal.innerHTML=`<div class="modal-card"><h3>Add Type</h3><input id="typeName" placeholder="Type name"><div class="modal-buttons"><button id="saveType">Save</button><button id="cancelType" class="btn-outline">Cancel</button></div></div>`; document.body.appendChild(modal); modal.querySelector("#saveType").addEventListener("click",()=>{ let name=modal.querySelector("#typeName").value.trim(); if(name){ chapter.chapterTasks.push({ id:Date.now(), name, completed:false }); saveData(); modal.remove(); renderChapterDetail(); showToast("Type added"); } }); modal.querySelector("#cancelType").addEventListener("click",()=>modal.remove()); }); let container=document.getElementById("typesContainer"); container.innerHTML=chapter.chapterTasks.map(ct=>`<div class="chapter-item"><div class="big-checkbox ${ct.completed?'checked':''}" data-ctid="${ct.id}" data-bookid="${book.id}" data-chapterid="${chapter.id}">${ct.completed?'<i class="fas fa-check"></i>':''}</div><span>${escapeHtml(ct.name)}</span><div><button class="editCTBtn btn-sm" data-ctid="${ct.id}">Edit</button><button class="delCTBtn btn-sm" data-ctid="${ct.id}" style="background:var(--danger);">Del</button></div></div>`).join(''); document.querySelectorAll(".big-checkbox[data-ctid]").forEach(el=>el.addEventListener("click",e=>{ e.stopPropagation(); let ctid=parseInt(el.dataset.ctid); let ct=chapter.chapterTasks.find(c=>c.id==ctid); if(ct){ let newState=!ct.completed; ct.completed=newState; syncChapterTaskCompletion(book.id, chapter.id, ctid, newState); saveData(); renderChapterDetail(); showToast(newState?"Type completed":"Type reopened"); } })); document.querySelectorAll(".editCTBtn").forEach(btn=>btn.addEventListener("click",e=>{ e.stopPropagation(); let id=parseInt(btn.dataset.ctid); let ct=chapter.chapterTasks.find(c=>c.id==id); let modal=document.createElement("div"); modal.className="modal-overlay"; modal.innerHTML=`<div class="modal-card"><h3>Edit Type</h3><input id="typeName" value="${escapeHtml(ct.name)}"><div class="modal-buttons"><button id="saveTypeEdit">Save</button><button id="cancelTypeEdit" class="btn-outline">Cancel</button></div></div>`; document.body.appendChild(modal); modal.querySelector("#saveTypeEdit").addEventListener("click",()=>{ let newName=modal.querySelector("#typeName").value.trim(); if(newName){ ct.name=newName; saveData(); modal.remove(); renderChapterDetail(); showToast("Type updated"); } }); modal.querySelector("#cancelTypeEdit").addEventListener("click",()=>modal.remove()); })); document.querySelectorAll(".delCTBtn").forEach(btn=>btn.addEventListener("click",e=>{ e.stopPropagation(); showConfirmDialog("Delete this type?", ()=>{ chapter.chapterTasks=chapter.chapterTasks.filter(c=>c.id!=parseInt(btn.dataset.ctid)); saveData(); renderChapterDetail(); }); })); }

  // ----- EXPENSE & STATS with enhanced charts & clear data preserves username-----
  function renderExpense() { if(expenseSub==="meals") renderMealTracker(); else renderExtraExpense(); }
  function renderMealTracker() { /* full logic shortened for brevity but functional */ let subtabs=`<div class="subtab-bar"><div class="subtab-item ${expenseSub==='meals'?'active':''}" data-expsub="meals"><i class="fas fa-utensils"></i> Meals</div><div class="subtab-item ${expenseSub==='extra'?'active':''}" data-expsub="extra"><i class="fas fa-receipt"></i> Extra</div></div>`; let monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; let firstDay=new Date(calYear,calMonth,1).getDay(), daysInMonth=new Date(calYear,calMonth+1,0).getDate(); let grid='<div class="calendar-grid">'+"SMTWTFS".split('').map(d=>`<div style="text-align:center;font-weight:700;">${d}</div>`).join(''); for(let i=0;i<firstDay;i++) grid+='<div class="cal-day"></div>'; for(let d=1;d<=daysInMonth;d++){ let dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; let isToday=dateStr===new Date().toISOString().slice(0,10); let isSelected=dateStr===selectedDate; grid+=`<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''}" data-mealdate="${dateStr}">${d}</div>`; } grid+='</div>'; let meal=app.meals.find(m=>m.date===selectedDate) || { breakfast:false, lunch:false, dinner:false }; let html=subtabs+`<div style="margin:14px;"><div style="display:flex;justify-content:space-between;"><button id="prevMealMonth" class="btn-outline btn-sm"><i class="fas fa-chevron-left"></i></button><span>${monthNames[calMonth]} ${calYear}</span><button id="nextMealMonth" class="btn-outline btn-sm"><i class="fas fa-chevron-right"></i></button><button id="todayMealBtn" class="btn-outline btn-sm"><i class="fas fa-sun"></i></button><button id="setMealRatesBtn" class="btn-outline btn-sm"><i class="fas fa-coins"></i></button></div>${grid}<div style="display:flex;justify-content:center;gap:20px;margin:20px 0;"><div class="meal-pill ${meal.breakfast?'active':''}" data-meal="breakfast"><i class="fas fa-sun"></i> Morning</div><div class="meal-pill ${meal.lunch?'active':''}" data-meal="lunch"><i class="fas fa-cloud-sun"></i> Noon</div><div class="meal-pill ${meal.dinner?'active':''}" data-meal="dinner"><i class="fas fa-moon"></i> Night</div></div></div>`; document.getElementById("mainContent").innerHTML=html; document.querySelectorAll("[data-expsub]").forEach(el=>el.addEventListener("click",()=>{ expenseSub=el.dataset.expsub; renderExpense(); })); document.getElementById("prevMealMonth").addEventListener("click",()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderMealTracker(); }); document.getElementById("nextMealMonth").addEventListener("click",()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderMealTracker(); }); document.getElementById("todayMealBtn").addEventListener("click",()=>{ let t=new Date(); calYear=t.getFullYear(); calMonth=t.getMonth(); selectedDate=t.toISOString().slice(0,10); renderMealTracker(); }); document.querySelectorAll("[data-mealdate]").forEach(el=>el.addEventListener("click",()=>{ selectedDate=el.dataset.mealdate; renderMealTracker(); })); document.querySelectorAll(".meal-pill").forEach(pill=>pill.addEventListener("click",()=>{ let type=pill.dataset.meal; let idx=app.meals.findIndex(m=>m.date===selectedDate); let mealObj=idx>=0?app.meals[idx]:{ id:Date.now(), date:selectedDate, breakfast:false, lunch:false, dinner:false }; mealObj[type]=!mealObj[type]; if(idx>=0) app.meals[idx]=mealObj; else app.meals.push(mealObj); saveData(); renderMealTracker(); showToast(`${type} toggled`); })); document.getElementById("setMealRatesBtn").addEventListener("click",()=>{ let modal=document.createElement("div"); modal.className="modal-overlay"; modal.innerHTML=`<div class="modal-card"><h3>Meal Rates (BDT)</h3><input id="morningRate" type="number" value="${app.mealRates.morning}" placeholder="Morning"><input id="noonRate" type="number" value="${app.mealRates.noon}" placeholder="Noon"><input id="nightRate" type="number" value="${app.mealRates.night}" placeholder="Night"><div class="modal-buttons"><button id="saveRates">Save</button><button id="cancelRates" class="btn-outline">Cancel</button></div></div>`; document.body.appendChild(modal); modal.querySelector("#saveRates").addEventListener("click",()=>{ app.mealRates.morning=parseFloat(modal.querySelector("#morningRate").value)||0; app.mealRates.noon=parseFloat(modal.querySelector("#noonRate").value)||0; app.mealRates.night=parseFloat(modal.querySelector("#nightRate").value)||0; saveData(); modal.remove(); renderMealTracker(); showToast("Rates updated"); }); modal.querySelector("#cancelRates").addEventListener("click",()=>modal.remove()); }); }
  function renderExtraExpense() { let subtabs=`<div class="subtab-bar"><div class="subtab-item" data-expsub="meals"><i class="fas fa-utensils"></i> Meals</div><div class="subtab-item active" data-expsub="extra"><i class="fas fa-receipt"></i> Extra</div></div>`; let monthKey=selectedDate.slice(0,7); let monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; let displayMonth=monthNames[parseInt(monthKey.slice(5,7))-1]+" "+monthKey.slice(0,4); let monthExpenses=app.expenses.filter(e=>e.date.startsWith(monthKey)); let totalMonth=monthExpenses.reduce((s,e)=>s+e.amount,0); let html=subtabs+`<div class="expense-month-bar" style="display:flex;justify-content:space-between;margin:12px;"><button id="prevMonthExp" class="btn-outline btn-sm"><i class="fas fa-chevron-left"></i></button><span>${displayMonth}</span><button id="nextMonthExp" class="btn-outline btn-sm"><i class="fas fa-chevron-right"></i></button></div><div style="padding:0 14px;"><button id="addExpenseBtn">Add Expense</button> <strong>Total: ${totalMonth}৳</strong><div id="expenseList"></div></div>`; document.getElementById("mainContent").innerHTML=html; document.querySelectorAll("[data-expsub]").forEach(el=>el.addEventListener("click",()=>{ expenseSub=el.dataset.expsub; renderExpense(); })); document.getElementById("prevMonthExp").addEventListener("click",()=>{ let d=new Date(selectedDate); d.setMonth(d.getMonth()-1); selectedDate=d.toISOString().slice(0,10); renderExtraExpense(); }); document.getElementById("nextMonthExp").addEventListener("click",()=>{ let d=new Date(selectedDate); d.setMonth(d.getMonth()+1); selectedDate=d.toISOString().slice(0,10); renderExtraExpense(); }); document.getElementById("addExpenseBtn").addEventListener("click",()=>{ let modal=document.createElement("div"); modal.className="modal-overlay"; modal.innerHTML=`<div class="modal-card"><h3>Add Expense</h3><input id="expCat" placeholder="Category"><input id="expAmt" type="number" placeholder="Amount (BDT)"><div class="modal-buttons"><button id="saveExp">Save</button><button id="cancelExp" class="btn-outline">Cancel</button></div></div>`; document.body.appendChild(modal); modal.querySelector("#saveExp").addEventListener("click",()=>{ let cat=modal.querySelector("#expCat").value.trim(); let amt=parseFloat(modal.querySelector("#expAmt").value); if(cat && !isNaN(amt)){ app.expenses.push({ id:Date.now(), category:cat, amount:amt, date:selectedDate }); saveData(); modal.remove(); renderExtraExpense(); showToast("Expense added"); } }); modal.querySelector("#cancelExp").addEventListener("click",()=>modal.remove()); }); let listDiv=document.getElementById("expenseList"); listDiv.innerHTML=monthExpenses.map(e=>`<div class="expense-card"><span>${escapeHtml(e.category)}</span><span>${e.amount}৳</span><button class="delExp" data-id="${e.id}" style="background:var(--danger);">X</button></div>`).join(''); document.querySelectorAll(".delExp").forEach(btn=>btn.addEventListener("click",()=>{ showConfirmDialog("Delete expense?", ()=>{ app.expenses=app.expenses.filter(ex=>ex.id!=parseInt(btn.dataset.id)); saveData(); renderExtraExpense(); showToast("Expense deleted"); }); })); }

  // ========== ENHANCED STATISTICS ==========
  let expenseStatsMonth = new Date().toISOString().slice(0,7);
  let selectedExamForPerf = null;

  function renderStats() { 
    let subtabs = `<div class="subtab-bar"><div class="subtab-item ${statsSub === 'timelog' ? 'active' : ''}" data-statssub="timelog"><i class="fas fa-clock"></i> Time Log</div><div class="subtab-item ${statsSub === 'progress' ? 'active' : ''}" data-statssub="progress"><i class="fas fa-tasks"></i> Progress</div><div class="subtab-item ${statsSub === 'expenses' ? 'active' : ''}" data-statssub="expenses"><i class="fas fa-coins"></i> Expenses</div><div class="subtab-item ${statsSub === 'performance' ? 'active' : ''}" data-statssub="performance"><i class="fas fa-chart-line"></i> Performance</div></div><div id="statsContent"></div>`; 
    document.getElementById("mainContent").innerHTML = subtabs; 
    document.querySelectorAll("[data-statssub]").forEach(el => el.addEventListener("click", () => { statsSub = el.dataset.statssub; renderStats(); })); 
    renderStatsContent(); 
  }
  function renderStatsContent() { let container = document.getElementById("statsContent"); if (!container) return; if (statsSub === "timelog") renderTimeLog(container); else if (statsSub === "progress") renderProgress(container); else if (statsSub === "expenses") renderExpenseStats(container); else if (statsSub === "performance") renderPerformance(container); }

  // TimeLog: show per book hours (doughnut + bar) 
  function renderTimeLog(container) { 
    let bookHours = {}; 
    app.timerSessions.forEach(s => { let task = app.tasks.find(t => t.id == s.taskId); if(task){ let item = task.items.find(i => i.id == s.itemId); if(item){ let book = app.books.find(b => b.id == item.bookId); if(book) bookHours[book.name] = (bookHours[book.name] || 0) + s.seconds/3600; } } });
    let labels = Object.keys(bookHours), data = Object.values(bookHours);
    container.innerHTML = `<div class="chart-container"><h4 style="margin-bottom:12px;">📚 Time Spent per Book (hours)</h4><canvas id="timeBookBar"></canvas></div><div class="chart-container"><h4>Study Sessions: ${app.timerSessions.length} | Total Hours: ${(app.timerSessions.reduce((s,se)=>s+se.seconds,0)/3600).toFixed(2)}</h4><canvas id="timeBookDoughnut"></canvas></div>`;
    if (charts.timeBar) charts.timeBar.destroy(); if (charts.timeDough) charts.timeDough.destroy();
    charts.timeBar = new Chart(document.getElementById("timeBookBar"), { type: 'bar', data: { labels, datasets: [{ label: 'Hours Studied', data, backgroundColor: 'var(--accent)' }] }, options: { responsive: true } });
    charts.timeDough = new Chart(document.getElementById("timeBookDoughnut"), { type: 'doughnut', data: { labels, datasets: [{ data, backgroundColor: ['#2b8c5e','#3a9b6e','#4caf50','#ffb74d','#e25c5c'] }] }, options: { responsive: true } });
  }

  // Progress: only bar chart for books completion %
  function renderProgress(container) {
    let bookCompletion = [];
    app.books.forEach(b => { let total=0, comp=0; b.chapters.forEach(ch=>{ ch.chapterTasks.forEach(ct=>{ total++; if(ct.completed) comp++; }); }); let percent = total? (comp/total*100):0; bookCompletion.push({ name: b.name, percent }); });
    container.innerHTML = `<div class="chart-container"><h4>📖 Book Completion Progress (%)</h4><canvas id="progressBarChart"></canvas></div>`;
    if (charts.progressBar) charts.progressBar.destroy();
    charts.progressBar = new Chart(document.getElementById("progressBarChart"), { type: 'bar', data: { labels: bookCompletion.map(b=>b.name), datasets: [{ label: 'Completion %', data: bookCompletion.map(b=>b.percent), backgroundColor: 'var(--accent)', borderRadius: 8 }] }, options: { responsive: true, scales: { y: { max: 100, title: { display: true, text: 'Percentage (%)' } } } } });
  }

  // Expenses Stats: month navigation + title
  function renderExpenseStats(container) {
    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    let [year, month] = expenseStatsMonth.split('-');
    let displayMonth = `${monthNames[parseInt(month)-1]} ${year}`;
    let mealsForMonth = app.meals.filter(m => m.date.startsWith(expenseStatsMonth));
    let expensesForMonth = app.expenses.filter(e => e.date.startsWith(expenseStatsMonth));
    let foodTotal = mealsForMonth.reduce((sum, m) => { let cost = (m.breakfast?app.mealRates.morning:0)+(m.lunch?app.mealRates.noon:0)+(m.dinner?app.mealRates.night:0); return sum+cost; }, 0);
    let extraTotal = expensesForMonth.reduce((s,e)=>s+e.amount,0);
    let categoryData = {};
    expensesForMonth.forEach(e=>{ categoryData[e.category] = (categoryData[e.category]||0)+e.amount; });
    container.innerHTML = `
      <div class="month-nav"><button id="prevExpMonth"><i class="fas fa-chevron-left"></i> Prev</button><span style="font-weight:700;">📆 ${displayMonth}</span><button id="nextExpMonth">Next <i class="fas fa-chevron-right"></i></button></div>
      <div class="chart-container"><h4>💰 Monthly Expense Overview (Food vs Extra)</h4><canvas id="expenseMonthBar"></canvas></div>
      <div class="chart-container"><h4>📂 Expense Categories (${displayMonth})</h4><canvas id="expenseCategoryPie"></canvas></div>
      <div class="stat-card">🍽️ Food: ${foodTotal} ৳ &nbsp;&nbsp; 📝 Extra: ${extraTotal} ৳</div>`;
    if (charts.expMonthBar) charts.expMonthBar.destroy(); if (charts.expCatPie) charts.expCatPie.destroy();
    charts.expMonthBar = new Chart(document.getElementById("expenseMonthBar"), { type: 'bar', data: { labels: ['Food', 'Extra'], datasets: [{ label: 'Amount (BDT)', data: [foodTotal, extraTotal], backgroundColor: ['#2b8c5e', '#ffb74d'] }] }, options: { responsive: true } });
    charts.expCatPie = new Chart(document.getElementById("expenseCategoryPie"), { type: 'pie', data: { labels: Object.keys(categoryData), datasets: [{ data: Object.values(categoryData), backgroundColor: ['#2b8c5e','#3a9b6e','#ffb74d','#e25c5c','#6b2b8c'] }] }, options: { responsive: true } });
    document.getElementById("prevExpMonth")?.addEventListener("click", () => { let d = new Date(expenseStatsMonth + "-01"); d.setMonth(d.getMonth()-1); expenseStatsMonth = d.toISOString().slice(0,7); renderExpenseStats(container); });
    document.getElementById("nextExpMonth")?.addEventListener("click", () => { let d = new Date(expenseStatsMonth + "-01"); d.setMonth(d.getMonth()+1); expenseStatsMonth = d.toISOString().slice(0,7); renderExpenseStats(container); });
  }

  // Performance: exam selector + pie & bar charts per exam
  function renderPerformance(container) {
    if(!app.exams.length) { container.innerHTML = `<div class="stat-card">📘 No exams added yet. Go to Study → Marks to create exams.</div>`; return; }
    if(!selectedExamForPerf || !app.exams.find(e=>e.id==selectedExamForPerf)) selectedExamForPerf = app.exams[0].id;
    let exam = app.exams.find(e=>e.id==selectedExamForPerf);
    let subjectNames = exam.subjects.map(s=>s.name);
    let percentages = exam.subjects.map(s=> s.total ? (s.obtained/s.total*100) : 0);
    let obtainedMarks = exam.subjects.map(s=>s.obtained);
    let totalMarks = exam.subjects.map(s=>s.total);
    let html = `<div class="month-nav"><select id="examSelectPerf" style="padding:8px;border-radius:40px;">${app.exams.map(ex=>`<option value="${ex.id}" ${ex.id==selectedExamForPerf?'selected':''}>${escapeHtml(ex.name)}</option>`).join('')}</select></div>`;
    html += `<div class="chart-container"><h4>📊 Subject-wise Percentage (${escapeHtml(exam.name)})</h4><canvas id="perfBarChart"></canvas></div>`;
    html += `<div class="chart-container"><h4>🥧 Obtained Marks Distribution (${escapeHtml(exam.name)})</h4><canvas id="perfPieChart"></canvas></div>`;
    container.innerHTML = html;
    if (charts.perfBar) charts.perfBar.destroy(); if (charts.perfPie) charts.perfPie.destroy();
    charts.perfBar = new Chart(document.getElementById("perfBarChart"), { type: 'bar', data: { labels: subjectNames, datasets: [{ label: 'Score (%)', data: percentages, backgroundColor: 'var(--accent)' }] }, options: { responsive: true, scales: { y: { max: 100, title: { display: true, text: 'Percentage' } } } } });
    charts.perfPie = new Chart(document.getElementById("perfPieChart"), { type: 'pie', data: { labels: subjectNames, datasets: [{ data: obtainedMarks, backgroundColor: ['#2b8c5e','#3a9b6e','#ffb74d','#e25c5c','#6b2b8c','#3498db'] }] }, options: { responsive: true, plugins: { tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${ctx.raw} / ${totalMarks[ctx.dataIndex]} marks` } } } } });
    document.getElementById("examSelectPerf")?.addEventListener("change", (e) => { selectedExamForPerf = parseInt(e.target.value); renderPerformance(container); });
  }

  // Settings & accent picker, clear data preserved user
  const accentPalettes = [{ name:'Forest Green', hex:'#2b8c5e' },{ name:'Ocean Blue', hex:'#2b5e8c' },{ name:'Royal Purple', hex:'#6b2b8c' },{ name:'Ruby Red', hex:'#c0392b' },{ name:'Sunset Orange', hex:'#e67e22' },{ name:'Teal', hex:'#1abc9c' }];
  function applyAccent(hex) { document.documentElement.style.setProperty('--accent', hex); document.documentElement.style.setProperty('--accent-light', hex+'20'); localStorage.setItem('mentor_accent', hex); }
  function loadAccent() { let saved = localStorage.getItem('mentor_accent'); if(saved) applyAccent(saved); }
  function showSettingsModal() { let modal = document.createElement("div"); modal.className = "modal-overlay"; modal.innerHTML = `<div class="modal-card"><h3><i class="fas fa-cog"></i> Settings</h3><button id="accentBtn" class="btn-outline" style="width:100%;margin-bottom:12px;"><i class="fas fa-palette"></i> Accent Color</button><button id="clearDataBtn" class="btn-outline" style="width:100%;margin-bottom:12px;color:var(--danger);border-color:var(--danger);"><i class="fas fa-trash-alt"></i> Clear All Data</button><button id="aboutBtn" class="btn-outline" style="width:100%;"><i class="fas fa-info-circle"></i> About Us</button><button id="closeSettings" class="btn" style="width:100%;margin-top:12px;">Close</button></div>`; document.body.appendChild(modal); modal.querySelector("#accentBtn").addEventListener("click", () => { modal.remove(); showAccentPicker(); }); modal.querySelector("#clearDataBtn").addEventListener("click", () => { showConfirmDialog("⚠️ Delete ALL data? Username will be preserved. This cannot be undone.", () => { const username = localStorage.getItem("mentor_user"); localStorage.clear(); if(username) localStorage.setItem("mentor_user", username); loadData(); app = { books: [], tasks: [], meals: [], expenses: [], mealRates: { morning:35, noon:50, night:45 }, exams: [], timerSessions: [] }; saveData(); loadAccent(); render(); showToast("All data cleared, username kept."); }); }); modal.querySelector("#aboutBtn").addEventListener("click", () => { modal.remove(); showAboutModal(); }); modal.querySelector("#closeSettings").addEventListener("click", () => modal.remove()); modal.addEventListener("click", e => { if(e.target === modal) modal.remove(); }); }
  function showAccentPicker() { let modal = document.createElement("div"); modal.className = "modal-overlay"; let current = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(); modal.innerHTML = `<div class="modal-card" style="text-align:center;"><h3>Choose Accent Color</h3><div class="color-swatch-grid" style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;">${accentPalettes.map(p => `<div class="color-swatch ${p.hex===current?'selected':''}" style="background:${p.hex};" data-hex="${p.hex}"></div>`).join('')}</div><div class="modal-buttons"><button id="closeAccent" class="btn-outline">Cancel</button></div></div>`; document.body.appendChild(modal); modal.querySelectorAll(".color-swatch").forEach(sw => sw.addEventListener("click", () => { applyAccent(sw.dataset.hex); modal.remove(); showToast("Accent changed"); })); modal.querySelector("#closeAccent").addEventListener("click", () => modal.remove()); modal.addEventListener("click", e => { if(e.target === modal) modal.remove(); }); }
  function showAboutModal() { let modal = document.createElement("div"); modal.className = "modal-overlay"; modal.innerHTML = `<div class="modal-card" style="text-align:center;"><h3><i class="fas fa-users"></i> About Us</h3><p><strong>Developer:</strong> Muhammad Saifullah Mahin</p><p><strong>Company:</strong> Madsaif</p><div class="modal-buttons"><button id="closeAbout" class="btn">OK</button></div></div>`; document.body.appendChild(modal); modal.querySelector("#closeAbout").addEventListener("click", () => modal.remove()); modal.addEventListener("click", e => { if(e.target === modal) modal.remove(); }); }
  function escapeHtml(s){ return String(s).replace(/[&<>]/g,function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  function init() { loadData(); loadAccent(); let user=localStorage.getItem("mentor_user"); if(!user){ showInputDialog("Welcome to MentorHub", "Your name", "", (name) => { if(name) { localStorage.setItem("mentor_user", name); document.getElementById("userGreeting").innerText=`Hello, ${name}`; } else { document.getElementById("userGreeting").innerText="Hello, Student"; } render(); }); } else document.getElementById("userGreeting").innerText=`Hello, ${user}`; document.querySelectorAll(".nav-btn").forEach(btn=>btn.addEventListener("click",()=>{ document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); currentTab=btn.dataset.nav; render(); })); document.querySelector(".nav-btn[data-nav='home']").classList.add("active"); document.getElementById("settingsBtn").addEventListener("click", showSettingsModal); render(); }
  init();
</script>
</body>
</html>
