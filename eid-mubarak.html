<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background: radial-gradient(circle at top,#0b1220,#020617 75%);
display:flex;
justify-content:center;
align-items:center;
}

/* START SCREEN */

.start-screen{
position:fixed;
inset:0;
background:#020617;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
text-align:center;
padding:20px;
}

.start-screen h1{
color:white;
font-size:clamp(32px,5vw,60px);
font-weight:800;
text-shadow:0 0 20px #00ffd5;
}

.start-btn{
margin-top:25px;
padding:14px 36px;
font-size:clamp(16px,2vw,20px);
border:none;
border-radius:50px;
cursor:pointer;
font-weight:700;
color:#02131f;
background:linear-gradient(45deg,#00ffd5,#7cffcb);
box-shadow:0 0 25px rgba(0,255,213,.6);
transition:.3s;
}

.start-btn:hover{
transform:scale(1.05);
}

/* SKY */

.stars{
position:absolute;
width:100%;
height:100%;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%,100%{opacity:.2}
50%{opacity:1}
}

/* MOON */

.moon{
position:absolute;
top:8vh;
right:6vw;
width:clamp(90px,15vw,170px);
height:clamp(90px,15vw,170px);
background:#ffe082;
border-radius:50%;
box-shadow:0 0 40px #ffe082,0 0 80px #ffd54f;
opacity:0;
transition:2s;
}

.moon::before{
content:'';
position:absolute;
width:100%;
height:100%;
background:#020617;
border-radius:50%;
top:-10%;
left:25%;
}

/* MOSQUE (FIXED RESPONSIVE BASE) */

.mosque{
position:absolute;
bottom:-40vh;
width:100%;
height:45vh;
transition:2s;
}

.mosque svg{
width:100%;
height:100%;
display:block;
filter: drop-shadow(0 0 25px rgba(0,255,213,.15));
}

/* TEXT CENTER FIX */

.text{
position:absolute;
width:100%;
text-align:center;
top:50%;
left:50%;
transform:translate(-50%,30px);
opacity:0;
transition:2s;
padding:0 15px;
}

.text h1{
font-size:clamp(38px,7vw,100px);
color:white;
font-weight:800;
text-shadow:0 0 25px #00ffd5;
}

.text p{
margin-top:12px;
font-size:clamp(14px,2vw,22px);
color:#dbeafe;
}

/* BUTTON */

.site-btn{
display:inline-block;
margin-top:25px;
padding:12px 30px;
border-radius:50px;
text-decoration:none;
font-weight:700;
font-size:clamp(14px,2vw,18px);
color:#02131f;
background:linear-gradient(45deg,#00ffd5,#7cffcb);
box-shadow:0 0 25px rgba(0,255,213,.6);
}

/* FIREWORK */

.firework{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
animation:boom 1.6s ease-out forwards;
}

@keyframes boom{
0%{transform:scale(0);opacity:1}
100%{transform:scale(25);opacity:0}
}

/* SHOW STATES */

.show-moon{opacity:1}
.show-text{opacity:1;transform:translate(-50%,0)}

.hide{
opacity:0;
pointer-events:none;
}

/* MOBILE EXTRA FIX */

@media(max-width:480px){

.moon{
right:10px;
top:6vh;
}

.text{
top:48%;
}

}

</style>
</head>

<body>

<audio id="music" loop>
<source src="eid.mp3" type="audio/mp3">
</audio>

<!-- START -->
<div class="start-screen" id="startScreen">
<h1>Hi🤭🤭</h1>
<button class="start-btn" onclick="start()">press the button </button>
</div>

<!-- SKY -->
<div class="stars" id="stars"></div>

<!-- MOON -->
<div class="moon" id="moon"></div>

<!-- MOSQUE -->
<div class="mosque" id="mosque">
<svg viewBox="0 0 1440 500">
<path fill="#08111f"
d="M0 500 L0 300 L100 300 L150 180 L200 300 L320 300 L370 120 L420 300 L560 300 L620 80 L680 300 L760 300 L820 150 L880 300 L1000 300 L1060 180 L1120 300 L1240 300 L1300 130 L1360 300 L1440 300 L1440 500 Z"/>
</svg>
</div>

<!-- TEXT -->
<div class="text" id="text">
<h1>Eid Mubarak</h1>
<p>May peace and happiness fill your life 🌙</p>
<a class="site-btn" href="https://madsaif.com" target="_blank">
Visit Our Website
</a>
</div>

<script>

/* STARS */
const stars=document.getElementById("stars");

for(let i=0;i<250;i++){
let s=document.createElement("div");
s.className="star";
s.style.top=Math.random()*100+"%";
s.style.left=Math.random()*100+"%";
s.style.animationDuration=(Math.random()*3+2)+"s";
stars.appendChild(s);
}

/* START */

function start(){

document.getElementById("music").play();
document.getElementById("startScreen").classList.add("hide");

setTimeout(()=>{
document.getElementById("moon").classList.add("show-moon");
},600);

setTimeout(()=>{
document.getElementById("text").classList.add("show-text");
},2000);

setInterval(firework,350);

}

/* FIREWORK */

function firework(){

let f=document.createElement("div");
f.className="firework";
f.style.left=Math.random()*window.innerWidth+"px";
f.style.top=Math.random()*window.innerHeight+"px";
f.style.background=`hsl(${Math.random()*360},100%,70%)`;

document.body.appendChild(f);

setTimeout(()=>f.remove(),1600);
}

</script>

</body>
</html>
